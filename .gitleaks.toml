# Narrow allowlists for values that are intentionally public/non-secret.
# Keep these path + exact-format combinations; do not add broad path-only ignores.

[[allowlists]]
description = "Firebase Android client API key in the standard google-services.json config; restrict it in Google Cloud to the Android app and required APIs."
paths = ['''^android/app/google-services\.json$''']
regexTarget = "secret"
regexes = ['''^AIza[0-9A-Za-z_-]{35}$''']

[[allowlists]]
description = "Local diagnostics storage namespace, not an authentication or API credential."
paths = ['''^src/diagnostics\.tsx$''', '''^src/utils/diagnostics\.ts$''']
regexTarget = "secret"
regexes = ['''^sooqy_diagnostics_v1$''']
