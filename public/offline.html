<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0A0A0A">
    <title>Arownd — غير متصل</title>
    <style>
      :root { color-scheme: light dark; font-family: "IBM Plex Sans Arabic", Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #F5F5F5; color: #0A0A0A; }
      main { width: min(100%, 420px); padding: 32px 24px; border: 1px solid #dedede; border-radius: 24px; background: #fff; text-align: center; }
      .mark { display: grid; place-items: center; width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 18px; background: #C6F135; color: #0A0A0A; font-weight: 800; font-size: 22px; }
      h1 { margin: 0 0 10px; font-size: 22px; }
      p { margin: 0; color: #555; line-height: 1.8; }
      @media (prefers-color-scheme: dark) {
        body { background: #0A0A0A; color: #F5F5F5; }
        main { background: #171717; border-color: #333; }
        p { color: #bbb; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">A</div>
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>لا يمكن تحميل هذه الصفحة الآن. أعد الاتصال بالإنترنت ثم حاول مجددًا.</p>
    </main>
  </body>
</html>
