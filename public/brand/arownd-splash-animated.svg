<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" style="background:#000" role="img" aria-label="Arownd" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Arownd</title>
  <style>
    /* 0-0.3s أسود | 0.3-0.7 A | 0.7-1.4 الحلقة | 1.4-1.8 الأيقونة + التوهج | تنتهي عند ظهور السلتين */
    .bg   { opacity: 0; animation: bg-in 800ms ease-out 300ms both; }
    .a    { transform-box: fill-box; transform-origin: 50% 50%; opacity: 0;
             animation: a-in 400ms cubic-bezier(.25,1,.5,1) 300ms both; }
    .ring { stroke-dasharray: 100 100; stroke-dashoffset: 102;
             animation: ring-draw 700ms cubic-bezier(.65,0,.35,1) 700ms both; }
    .icon { transform-box: view-box; transform-origin: 752.4px 271.6px; opacity: 0;
             animation: icon-pop 400ms linear 1400ms both; }
    .glow { transform-box: view-box; transform-origin: 752.4px 271.6px; opacity: 0;
             animation: glow-flash 400ms ease-out 1400ms both; }

    @keyframes bg-in    { to { opacity: 1; } }
    @keyframes a-in     { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }
    @keyframes ring-draw { from { stroke-dashoffset: 102; } to { stroke-dashoffset: 0; } }
    @keyframes icon-pop {
      0%   { opacity: 0; transform: scale(.6);  animation-timing-function: cubic-bezier(.16,1,.3,1); }
      60%  { opacity: 1; transform: scale(1.05); animation-timing-function: cubic-bezier(.45,0,.55,1); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes glow-flash {
      0%   { opacity: 0;  transform: scale(.6); }
      35%  { opacity: 1;  transform: scale(1.05); }
      100% { opacity: .2; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .bg, .a, .ring, .icon, .glow { animation: none; }
      .bg, .a, .icon { opacity: 1; }
      .ring { stroke-dashoffset: 0; }
      .glow { opacity: .2; }
    }
  </style>

  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#1c1c1e"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0"    stop-color="#B6F500" stop-opacity=".7"/>
      <stop offset=".25"  stop-color="#B6F500" stop-opacity=".42"/>
      <stop offset=".5"   stop-color="#B6F500" stop-opacity=".16"/>
      <stop offset=".75"  stop-color="#B6F500" stop-opacity=".04"/>
      <stop offset="1"    stop-color="#B6F500" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="#000"/>
  <rect class="bg" width="1024" height="1024" fill="url(#bg)"/>

  <!-- lime glow behind the icon -->
  <circle class="glow" cx="752.4" cy="271.6" r="210" fill="url(#glow)"/>

  <!-- orbit ring: starts at lower gap edge (20deg), clockwise, ends at the icon gap -->
  <path class="ring" d="M831.5 395.7 A340 340 0 1 1 628.3 192.5" pathLength="100" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round"/>

