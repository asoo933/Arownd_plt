name: Arownd dependency lockfile maintenance

on:
  workflow_dispatch:
  push:
    branches:
      - Arownd-native-v2
    paths:
      - package.json
      - pnpm-workspace.yaml
      - .npmrc
      - mobile/package.json
      - lib/**/package.json
      - artifacts/**/package.json
      - .github/workflows/repository-cleanup.yml

permissions:
  contents: write

concurrency:
  group: arownd-dependency-lockfiles
  cancel-in-progress: false

jobs:
  generate-lockfiles:
    name: Generate and commit npm and pnpm lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify target branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" != "refs/heads/Arownd-native-v2" ]]; then
            echo "::error::Push-triggered lockfile maintenance is allowed only on Arownd-native-v2."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" && "$GITHUB_REF" != "refs/heads/Arownd-native-v2" ]]; then
            echo "::error::Dispatch this workflow from main or Arownd-native-v2."
            exit 1
          fi

      - name: Checkout Arownd-native-v2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: Arownd-native-v2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify workspace manifests and record tool versions
        shell: bash
        run: |
          set -euo pipefail
          test -s package.json
          test -s pnpm-workspace.yaml
          test -s mobile/package.json
          node <<'NODE'
          const fs = require("node:fs");
          const root = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const mobile = JSON.parse(fs.readFileSync("mobile/package.json", "utf8"));
          if (root.packageManager !== "pnpm@10.34.9") {
            throw new Error("Root package.json must pin pnpm@10.34.9.");
          }
          if (mobile.name !== "@arownd/mobile") {
            throw new Error("Unexpected mobile package name.");
          }
          console.log("Workspace root and independent mobile package manifests are present.");
          NODE
          {
            echo "Workflow commit: $GITHUB_SHA"
            echo "Trigger: $GITHUB_EVENT_NAME"
            echo "Target branch: Arownd-native-v2"
            echo "Target commit: $(git rev-parse HEAD)"
            echo "Node: $(node --version)"
            echo "npm: $(npm --version)"
          } | tee cleanup-report.txt

      - name: Generate mobile npm lockfile
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps
          test -s package-lock.json

      - name: Activate pinned pnpm version
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.9 --activate
          test "$(pnpm --version)" = "10.34.9"
          echo "pnpm: $(pnpm --version)" | tee -a cleanup-report.txt

      - name: Generate pnpm workspace lockfile
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          test -s pnpm-lock.yaml
          grep -q "^  '\.'" pnpm-lock.yaml || grep -q '^  .:' pnpm-lock.yaml

      - name: Commit lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfiles are already up to date." | tee -a cleanup-report.txt
            exit 0
          fi
          git commit -m "Update repository dependency lockfiles"
          git push origin HEAD:Arownd-native-v2

      - name: Record final lockfile state
        if: always()
        shell: bash
        run: |
          {
            echo ""
            echo "Mobile npm lockfile: $([[ -s mobile/package-lock.json ]] && echo present || echo missing)"
            echo "Workspace pnpm lockfile: $([[ -s pnpm-lock.yaml ]] && echo present || echo missing)"
            echo "Temporary root manifest: not used"
          } >> cleanup-report.txt

      - name: Upload lockfile report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arownd-lockfile-report-${{ github.run_number }}
          path: cleanup-report.txt
          if-no-files-found: warn
          retention-days: 7
