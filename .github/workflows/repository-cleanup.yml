name: Arownd repository cleanup

on:
  workflow_dispatch:
  push:
    branches:
      - Arownd-native-v2
    paths:
      - .github/workflows/repository-cleanup.yml

permissions:
  contents: write

concurrency:
  group: arownd-repository-cleanup
  cancel-in-progress: false

jobs:
  generate-lockfiles:
    name: Generate and commit mobile lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify target branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" != "refs/heads/Arownd-native-v2" ]]; then
            echo "::error::Push-triggered cleanup is allowed only on Arownd-native-v2."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" && "$GITHUB_REF" != "refs/heads/Arownd-native-v2" ]]; then
            echo "::error::Dispatch this workflow from main or Arownd-native-v2."
            exit 1
          fi

      - name: Checkout Arownd-native-v2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: Arownd-native-v2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record repository package-manager state
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Workflow commit: $GITHUB_SHA"
            echo "Trigger: $GITHUB_EVENT_NAME"
            echo "Target branch: Arownd-native-v2"
            echo "Target commit: $(git rev-parse HEAD)"
            echo "Node: $(node --version)"
            echo "npm: $(npm --version)"
            echo "Root package.json: $([[ -f package.json ]] && echo present || echo missing)"
            echo "pnpm workspace: $([[ -f pnpm-workspace.yaml ]] && echo present || echo missing)"
            echo "Mobile package-lock: $([[ -f mobile/package-lock.json ]] && echo present || echo missing)"
          } | tee cleanup-report.txt

      - name: Generate mobile npm lockfile
        id: npm-lock
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps

      - name: Commit mobile npm lockfile
        id: commit-lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -s mobile/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "No mobile lockfile changes to commit."
            exit 0
          fi
          git commit -m "Add mobile npm lockfile"
          git push origin HEAD:Arownd-native-v2

      - name: Setup pnpm 10
        id: setup-pnpm
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10 --activate
          pnpm --version | tee -a cleanup-report.txt

      - name: Generate provisional pnpm workspace lockfile
        id: pnpm-lock
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          temporary_root_manifest=false
          if [[ ! -f package.json ]]; then
            printf '{\n  "name": "arownd-workspace-root",\n  "private": true\n}\n' > package.json
            temporary_root_manifest=true
            echo "Temporary root package manifest used for pnpm resolution." | tee -a cleanup-report.txt
          fi
          cleanup_temporary_manifest() {
            if [[ "$temporary_root_manifest" == true ]]; then
              rm -f package.json
            fi
          }
          trap cleanup_temporary_manifest EXIT
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

      - name: Record generation results
        if: always()
        shell: bash
        run: |
          {
            echo ""
            echo "npm lockfile step: ${{ steps.npm-lock.outcome }}"
            echo "mobile lockfile commit step: ${{ steps.commit-lockfile.outcome }}"
            echo "pnpm setup step: ${{ steps.setup-pnpm.outcome }}"
            echo "pnpm lockfile step: ${{ steps.pnpm-lock.outcome }}"
            echo "Generated mobile/package-lock.json: $([[ -s mobile/package-lock.json ]] && echo yes || echo no)"
            echo "Generated pnpm-lock.yaml: $([[ -s pnpm-lock.yaml ]] && echo yes || echo no)"
            echo "NOTE: pnpm-lock.yaml is provisional and is not committed."
          } >> cleanup-report.txt

      - name: Upload candidate lockfiles and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arownd-cleanup-candidates-${{ github.run_number }}
          path: |
            mobile/package-lock.json
            pnpm-lock.yaml
            cleanup-report.txt
          if-no-files-found: warn
          retention-days: 7
