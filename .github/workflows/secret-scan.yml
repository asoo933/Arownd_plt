name: Full-history secret scan

on:
  push:
    branches:
      - main
      - Arownd-native-v2
      - "work/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan full Git history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan every reachable commit
        run: |
          docker run --rm \
            -v "$PWD:/path" \
            zricethezav/gitleaks:v8.30.1 \
            detect --source=/path --config=/path/.gitleaks.toml --redact --verbose --log-opts="--all"
