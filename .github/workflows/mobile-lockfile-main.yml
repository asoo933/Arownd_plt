name: Refresh mobile npm lockfile

on:
  push:
    branches:
      - main
    paths:
      - mobile/package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arownd-mobile-lockfile-main
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate mobile package lock
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Commit lockfile when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "Mobile lockfile is already current."
            exit 0
          fi
          git commit -m "Update mobile dependency lockfile"
          git push origin HEAD:main
