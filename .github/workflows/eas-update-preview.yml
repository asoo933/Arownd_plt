name: Arownd Expo OTA preview update

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/eas-update-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arownd-expo-ota-preview
  cancel-in-progress: false

jobs:
  publish-update:
    name: Publish Android OTA update to Expo preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Validate required GitHub secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo "::error::Missing GitHub Actions secret EXPO_TOKEN"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "::error::Missing GitHub Actions secret EXPO_PUBLIC_SUPABASE_URL"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Missing GitHub Actions secret EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY"; exit 1; }

      - name: Install locked mobile dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Publish OTA update (no native build)
        run: npx --yes eas-cli update --channel preview --platform android --message "Arownd preview OTA ${GITHUB_SHA}" --non-interactive
