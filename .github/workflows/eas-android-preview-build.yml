name: Arownd EAS Android preview build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/eas-android-preview-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arownd-eas-android-preview
  cancel-in-progress: false

jobs:
  build-preview:
    name: Build Android preview with EAS
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Validate required GitHub secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo "::error::Missing GitHub Actions secret EXPO_TOKEN"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "::error::Missing GitHub Actions secret EXPO_PUBLIC_SUPABASE_URL"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Missing GitHub Actions secret EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY"; exit 1; }

      - name: Install locked mobile dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build preview APK with EAS
        run: npx --yes eas-cli build --platform android --profile preview --non-interactive
