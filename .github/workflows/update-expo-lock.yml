name: Temporary Expo lockfile refresh

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-expo-lock.yml"

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Update only the approved Expo patch versions
        working-directory: mobile
        run: |
          npm pkg set 'dependencies.expo=~58.0.24' 'dependencies.expo-constants=~58.0.16' 'dependencies.expo-linking=~58.0.17' 'dependencies.expo-router=~58.0.31' 'dependencies.expo-status-bar=~58.0.5' 'dependencies.expo-notifications=~58.1.9' 'dependencies.expo-font=~58.0.12' 'dependencies.expo-splash-screen=~58.0.14' 'dependencies.expo-haptics=~58.0.8'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps

      - name: Commit lockfile and dispatch quality checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Align Expo SDK 58 patch dependencies"
            git push origin main
            gh workflow run mobile-quality.yml --ref main
          fi

      - name: Remove temporary updater
        run: |
          if [ -f .github/workflows/update-expo-lock.yml ]; then
            git rm .github/workflows/update-expo-lock.yml
            git commit -m "Remove temporary Expo lockfile updater"
            git push origin main
          fi
