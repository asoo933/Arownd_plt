name: Arownd Native Android preview APK (Expo)

# Manual-only: updating this workflow must never start an APK build.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arownd-expo-android-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-preview-apk:
    name: Validate and build React Native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Expo app identity and Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const app = JSON.parse(fs.readFileSync("app.json", "utf8")).expo;
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const errors = [];
          if (app?.android?.package !== "com.arownd.app") errors.push("android.package must be com.arownd.app");
          if (app?.scheme !== "com.arownd.app") errors.push("scheme must be com.arownd.app");
          if (pkg?.main !== "expo-router/entry") errors.push("package main must be expo-router/entry");
          if (!pkg?.dependencies?.expo || !pkg?.dependencies?.["react-native"]) errors.push("Expo and React Native must be declared in mobile/package.json");
          if (pkg?.dependencies?.["@capacitor/android"] || pkg?.dependencies?.["@capacitor/core"]) errors.push("The native mobile app must not depend on Capacitor");
          if (errors.length) {
            for (const error of errors) console.error("::error::" + error);
            process.exit(1);
          }
          console.log("Expo / React Native app identity is valid.");
          NODE

          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "::error::Missing secret EXPO_PUBLIC_SUPABASE_URL"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Missing secret EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          node --input-type=module <<'NODE'
          const url = new URL(process.env.EXPO_PUBLIC_SUPABASE_URL);
          if (url.protocol !== "https:") {
            console.error("::error::EXPO_PUBLIC_SUPABASE_URL must use HTTPS.");
            process.exit(1);
          }
          if (process.env.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY.trim().length < 20) {
            console.error("::error::EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY looks incomplete.");
            process.exit(1);
          }
          console.log("Supabase public mobile configuration is valid.");
          NODE

      - name: Install Expo mobile dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Expo Doctor
        run: npm run doctor

      - name: Generate clean native Android project
        run: npx expo prebuild --platform android --clean --no-install --non-interactive

      - name: Verify Android Gradle tasks and assemble release APK
        working-directory: mobile/android
        run: ./gradlew lint testDebugUnitTest assembleRelease --no-daemon --stacktrace

      - name: Verify release APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "::error::Expected native Android APK is missing or empty: mobile/$APK"; exit 1; }
          ls -lh "$APK"

      - name: Upload native Android preview APK
        uses: actions/upload-artifact@v4
        with:
          name: arownd-react-native-preview-apk-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
