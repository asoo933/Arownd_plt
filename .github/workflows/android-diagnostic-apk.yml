name: Android diagnostic APK

# APK generation is manual-only until the Android work is explicitly resumed.
on:
  push:
    branches:
      - Arownd-native-v2
    paths:
      - ".github/workflows/android-diagnostic-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Capacitor CLI and Android platform dependencies
        run: |
          node -e "const p=require('./package.json'); const has=(name)=>Boolean(p.dependencies?.[name] || p.devDependencies?.[name]); const missing=['@capacitor/cli','@capacitor/android'].filter((name)=>!has(name)); if(missing.length){console.error('Missing declared native build dependencies: '+missing.join(', ')); process.exit(1)}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run repository quality gates before environment validation so missing
      # deployment configuration cannot hide TypeScript, lint, UI or test failures.
      - name: TypeScript
        run: pnpm run typecheck

      - name: ESLint
        run: pnpm run lint

      - name: Unified design-system checks
        run: pnpm run ui:check

      - name: Unit and component tests
        run: pnpm run test

      - name: Validate public Supabase build configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const required = ["VITE_SUPABASE_URL", "VITE_SUPABASE_PUBLISHABLE_KEY"];
          const missing = required.filter((name) => !process.env[name]?.trim());
          if (missing.length) {
            console.error("::error::Missing GitHub Actions secrets: " + missing.join(", "));
            console.error("Add these values in Settings > Secrets and variables > Actions. Do not commit them to the repository.");
            process.exit(1);
          }
          let url;
          try {
            url = new URL(process.env.VITE_SUPABASE_URL);
          } catch {
            console.error("::error::VITE_SUPABASE_URL must be a valid HTTPS URL.");
            process.exit(1);
          }
          if (url.protocol !== "https:") {
            console.error("::error::VITE_SUPABASE_URL must use HTTPS.");
            process.exit(1);
          }
          if (process.env.VITE_SUPABASE_PUBLISHABLE_KEY.trim().length < 20) {
            console.error("::error::VITE_SUPABASE_PUBLISHABLE_KEY looks incomplete.");
            process.exit(1);
          }
          console.log("Supabase public build configuration is present and structurally valid.");
          NODE

      - name: Build Capacitor web assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm run build:capacitor

      - name: Sync Android project
        run: pnpm exec cap sync android

      - name: Verify Android Gradle tasks and assemble APK
        working-directory: android
        run: ./gradlew lint testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Verify merged Android runtime permissions
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          android_ns = "{http://schemas.android.com/apk/res/android}"
          manifests = [
              path for path in Path("app/build/intermediates").rglob("AndroidManifest.xml")
              if "merged_manifest" in str(path) or "merged_manifests" in str(path)
          ]
          if not manifests:
              print("::error::No merged debug AndroidManifest.xml was produced.")
              sys.exit(1)

          manifest = max(manifests, key=lambda path: path.stat().st_mtime)
          root = ET.parse(manifest).getroot()
          permissions = {
              node.attrib.get(android_ns + "name")
              for node in root
              if node.tag in {"uses-permission", "uses-permission-sdk-23"}
          }
          required = {
              "android.permission.CAMERA",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.POST_NOTIFICATIONS",
          }
          missing = sorted(required - permissions)
          print(f"Verified merged manifest: {manifest}")
          print("Merged permissions:")
          for permission in sorted(permissions):
              print(f"  - {permission}")
          if missing:
              print("::error::Missing expected Android permissions: " + ", ".join(missing))
              sys.exit(1)
          PY

      - name: Verify APK artifact exists
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk || {
            echo "::error::Expected debug APK was not generated or is empty."
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arownd-diagnostic-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
