name: Arownd Native quality checks

on:
  push:
    branches:
      - main
      - Arownd-native-v2
      - cleanup/remove-legacy-web
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-quality.yml"
      - ".github/workflows/mobile-android-preview-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arownd-mobile-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript, ESLint, Vitest and Expo Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install locked Expo mobile dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Audit dependencies for high and critical vulnerabilities
        run: npm run audit

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: Expo Doctor
        run: npm run doctor
