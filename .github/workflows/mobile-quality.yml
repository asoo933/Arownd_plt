name: Arownd Native quality checks

on:
  push:
    branches:
      - Arownd-native-v2
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arownd-mobile-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript, Vitest and Expo Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Expo Doctor
        run: npm run doctor
