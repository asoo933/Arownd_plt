name: Generate Android upload keystore

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-keystore-generation
  cancel-in-progress: false

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate generation secrets
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD_NEW }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD_NEW }}
        run: |
          set -euo pipefail
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Add ANDROID_KEYSTORE_PASSWORD_NEW and ANDROID_KEY_PASSWORD_NEW in repository Actions secrets before running this workflow."
            exit 1
          fi
          if [ "${#STORE_PASSWORD}" -lt 16 ] || [ "${#KEY_PASSWORD}" -lt 16 ]; then
            echo "::error::Use passwords with at least 16 characters."
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate and verify JKS keystore
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD_NEW }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD_NEW }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/arownd-upload-key.jks"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias arownd \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=Arownd, OU=Android, O=Arownd, L=Constantine, ST=Algeria, C=DZ"
          keytool -list -v \
            -storetype JKS \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias arownd
          keytool -certreq \
            -keystore "$KEYSTORE_PATH" \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias arownd \
            -file "$RUNNER_TEMP/arownd-key-check.csr"
          rm -f "$RUNNER_TEMP/arownd-key-check.csr"
          chmod 600 "$KEYSTORE_PATH"
          mkdir -p "$RUNNER_TEMP/arownd-keystore-artifact"
          cp "$KEYSTORE_PATH" "$RUNNER_TEMP/arownd-keystore-artifact/arownd-upload-key.jks"
          chmod 600 "$RUNNER_TEMP/arownd-keystore-artifact/arownd-upload-key.jks"

      - name: Upload private keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: arownd-new-upload-keystore
          path: ${{ runner.temp }}/arownd-keystore-artifact/arownd-upload-key.jks
          if-no-files-found: error
          retention-days: 1
