name: Arownd Native Android debug APK (Expo)

# Manual-only debug build for device testing. Uses mobile/ Expo project, never root android/.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arownd-expo-android-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "::error::Missing secret EXPO_PUBLIC_SUPABASE_URL"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Missing secret EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          node --input-type=module -e 'const u = new URL(process.env.EXPO_PUBLIC_SUPABASE_URL); if (u.protocol !== "https:") process.exit(1);'

      - name: Install locked Expo mobile dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Validate Expo configuration
        run: npm run doctor

      - name: Generate clean native Android project
        run: npx expo prebuild --platform android --clean --no-install --non-interactive

      - name: Assemble debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify debug APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || { echo "::error::Expected native Android debug APK is missing or empty: mobile/$APK"; exit 1; }

      - name: Upload native Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arownd-react-native-debug-apk-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
