name: Arownd Native Android preview APK

on:
  workflow_run:
    workflows:
      - Arownd Native quality checks
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mobile-android-preview-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  build-preview-apk:
    name: Build Expo Native preview APK
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate public Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "::error::Missing GitHub Actions secret EXPO_PUBLIC_SUPABASE_URL"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Missing GitHub Actions secret EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY"; exit 1; }

      - name: Install locked mobile dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Generate Expo Android native preview project
        env:
          EAS_BUILD_PROFILE: preview
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Verify Android security manifest settings
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -s "$MANIFEST" || { echo "::error::Generated Android manifest is missing."; exit 1; }
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const manifest = fs.readFileSync("android/app/src/main/AndroidManifest.xml", "utf8");
          const required = [
            ['android:allowBackup="false"', "app backup must be disabled"],
            ['android:usesCleartextTraffic="false"', "cleartext traffic must be disabled"],
          ];
          const missing = required.filter(([attribute]) => !manifest.includes(attribute));
          if (missing.length) {
            for (const [, message] of missing) console.error("::error::" + message);
            process.exit(1);
          }

          // The release Gradle variant sets debuggable=false automatically.
          // A source-manifest override is rejected by Android Lint (HardcodedDebugMode).
          if (/android:debuggable\\s*=/.test(manifest)) {
            console.error("::error::Do not hardcode android:debuggable in the source manifest; Gradle controls release debuggability.");
            process.exit(1);
          }

          console.log("Android preview manifest security attributes verified.");
          NODE

      - name: Assemble release APK with embedded JS bundle
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: arownd-native-preview-apk-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
