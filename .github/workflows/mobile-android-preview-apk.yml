name: Arownd Native Android preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - Arownd-native-v2
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android-preview-apk.yml"

permissions:
  contents: read

concurrency:
  group: mobile-android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview-apk:
    name: Build Expo Native debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate public Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "::error::Missing GitHub Actions secret EXPO_PUBLIC_SUPABASE_URL"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Missing GitHub Actions secret EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY"; exit 1; }

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Generate Expo Android native project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Assemble debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: arownd-native-preview-apk-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
