name: Arownd release gate

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arownd-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript, lint, UI checks, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate lockfile from package manifests
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit synchronized lockfile on main
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: synchronize pnpm lockfile"
            git push origin HEAD:main
          fi

      - name: Verify lockfile is committed in pull requests
        if: ${{ github.event_name == 'pull_request' }}
        run: git diff --exit-code -- pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm exec tsc --noEmit

      - name: ESLint
        id: lint
        run: pnpm run lint

      - name: UI design-system checks
        if: ${{ success() || steps.lint.outcome == 'failure' }}
        run: pnpm run ui:check

      - name: Vitest
        if: ${{ success() || steps.lint.outcome == 'failure' }}
        run: pnpm test

      - name: Production build
        if: ${{ success() || steps.lint.outcome == 'failure' }}
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-public-key
        run: pnpm run build
