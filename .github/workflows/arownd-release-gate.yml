name: Arownd release gate

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arownd-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript, lint, UI checks, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (resolve lockfile updates in CI)
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript
        run: pnpm exec tsc --noEmit

      - name: ESLint
        id: lint
        run: pnpm run lint

      - name: UI design-system checks
        if: ${{ success() || steps.lint.outcome == 'failure' }}
        run: pnpm run ui:check

      - name: Vitest
        if: ${{ success() || steps.lint.outcome == 'failure' }}
        run: pnpm test

      - name: Production build
        if: ${{ success() || steps.lint.outcome == 'failure' }}
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-public-key
        run: pnpm run build
