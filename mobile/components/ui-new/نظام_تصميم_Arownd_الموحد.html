<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام تصميم Arownd الموحد</title>
<style>:root{--bg:#F5F5F5;--card:#FFFFFF;--ink:#0A0A0A;--mute:#525252;--line:#E5E5E5;--lime:#C6F135;--lg:#A8D522;--pink:#E5F8A8;--teal:#16A34A;--red:#DC2626;--onred:#FFFFFF;--mint:#EEEEEE;--dk:#0A0A0A;--info:#2563EB;--am:#D97706;--mx:#0A0A0A;--sh:0 1px 2px rgba(10,10,10,.05),0 8px 24px rgba(10,10,10,.05);--ring:#0A0A0A;--mp1:#E5E5E5;--mp2:#FFFFFF;--mp3:#DBEAFE;--black:#0A0A0A;--white:#FFFFFF;--lime-d:#A8D522;--lime-l:#E5F8A8;--n300:#D4D4D4;--n500:#737373;--n600:#525252;--n700:#333333;--n800:#262626;--bdc:#8C8C8C;--is:20px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0A0A;--card:#171717;--ink:#F5F5F5;--mute:#A3A3A3;--line:#333333;--lg:#C6F135;--pink:#C6F135;--mint:#262626;--mx:#F5F5F5;--sh:0 0 0 1px #262626;--ring:#C6F135;--mp1:#262626;--mp2:#333333;--mp3:color-mix(in srgb,#2563EB 30%,#171717);--bdc:#737373;color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark;--bdc:#737373;--bg:#0A0A0A;--card:#171717;--ink:#F5F5F5;--mute:#A3A3A3;--line:#333333;--lg:#C6F135;--pink:#C6F135;--mint:#262626;--mx:#F5F5F5;--sh:0 0 0 1px #262626;--ring:#C6F135;--mp1:#262626;--mp2:#333333;--mp3:color-mix(in srgb,#2563EB 30%,#171717)}
html[data-theme="light"]{color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--ring);outline-offset:3px}
.i,.lucide{width:var(--is,20px);height:var(--is,20px);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
x-i{display:inline-grid;place-items:center;flex:none}
x-i[hidden]{display:none}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
header,main{max-width:1100px;margin:auto;padding-inline:20px}
header{padding-top:32px}
.brand{display:flex;gap:14px;align-items:center}
.logo{width:52px;height:52px;border-radius:50%;background:var(--dk);color:var(--lime);display:grid;place-items:center;font-weight:700;font-size:24px;flex:none}
h1{font-size:26px;line-height:1.3;margin:0;font-weight:700}
header p{margin:2px 0 0;color:var(--mute);font-size:14px}
main{padding-bottom:96px}
h2{font-size:18px;font-weight:600;margin:40px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.c{background:var(--card);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;min-height:160px;box-shadow:var(--sh);position:relative}
.c>small{align-self:flex-start;color:var(--mute);font-size:12px;margin-top:auto}
.c.w{grid-column:span 2}
@media(max-width:600px){.c.w{grid-column:span 1}}
.mt{color:var(--mute);font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;width:100%}
/* buttons */
.btn{min-height:48px;padding:0 28px;border-radius:99px;background:var(--lime);color:var(--dk);font-weight:600;font-size:15px;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(.94)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn .spin{display:none}
.btn[aria-busy="true"] .spin{display:inline-block}
.btn[aria-busy="true"]{pointer-events:none}
.btn.o{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--lg);min-height:44px;padding:0 16px;font-weight:500;font-size:14px}
.btn.o:hover{background:color-mix(in srgb,var(--lime) 25%,transparent);filter:none}
.btn.n{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);padding:0 22px}
.btn.n:hover{background:var(--bg);filter:none}
.btn.sm{min-height:36px;padding:0 16px;font-size:13px}
.ic{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line);background:var(--card);display:grid;place-items:center;flex:none;position:relative;transition:background .15s,transform .1s}
.ic:hover{background:var(--bg)}
.ic:active{transform:scale(.93)}
.ic.l{background:var(--lime);color:var(--dk);box-shadow:none}
.ic.l:hover{filter:brightness(.94)}
.fav[aria-pressed="true"]{background:var(--pink);color:var(--dk);box-shadow:none}
.fav[aria-pressed="true"] .i{fill:currentColor}
.badge{position:absolute;top:-3px;inset-inline-end:-3px;min-width:20px;height:20px;border-radius:99px;background:var(--red);color:var(--onred);font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 0 2px var(--card)}

.cover{width:100%;height:132px;border-radius:24px;background:linear-gradient(135deg,var(--lime-l),var(--lime));position:relative;overflow:hidden}
.cover div{position:absolute;inset:auto 12px 12px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cover b{background:var(--card);border-radius:99px;padding:4px 12px;font-size:13px}
/* pager + steps */
.pager{display:flex;gap:4px;align-items:center}
.pager .pg{min-width:40px;height:40px;border-radius:50%;font-size:14px;color:var(--mute);display:grid;place-items:center}
.pager .pg:hover{background:var(--bg)}
.pager .pg[aria-current]{background:var(--pink);color:var(--dk);font-weight:600}
/* inputs */
.pick{display:flex;align-items:center;gap:12px;cursor:pointer}
.pick{position:relative;width:100%;min-height:48px;border-radius:99px;padding:0 16px;box-shadow:inset 0 0 0 1px var(--line);font-size:14.5px;transition:background .15s}
.pick:hover{background:var(--bg)}
.pick input{position:absolute;opacity:0;pointer-events:none}
.k{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--mute);display:grid;place-items:center;flex:none;color:transparent}
.pick:has(input:checked){background:var(--pink);box-shadow:none;color:var(--dk)}
.pick:has(input:checked) .k{background:var(--dk);box-shadow:none;color:var(--white)}
.k .i{width:12px;height:12px;stroke-width:3}
.pick:has(input:focus-visible){outline:2px solid var(--ring);outline-offset:3px}
.chips{display:flex;gap:8px;overflow-x:auto;width:100%;padding:6px;margin-block:-4px;scrollbar-width:none}
.chip{flex:none;min-height:40px;padding:0 18px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--line);font-size:14px}
.chip:hover{background:var(--bg)}
.chip[aria-pressed="true"]{background:var(--pink);color:var(--dk);box-shadow:none;font-weight:500}
.field{width:100%;display:flex;gap:10px;align-items:center;min-height:48px;box-shadow:inset 0 0 0 1px var(--bdc);border-radius:99px;padding:0 16px;color:var(--mute);transition:box-shadow .15s}
.field:focus-within{box-shadow:inset 0 0 0 2px var(--ring);color:var(--ink)}
.field input{all:unset;flex:1;min-width:0;font-size:15px;color:var(--ink)}
.field input::placeholder{color:var(--mute)}
.field input:focus-visible{outline:0}
.field .x{width:28px;height:28px;border-radius:50%;background:var(--line);display:grid;place-items:center}
.field .x .i{width:14px;height:14px}
/* product */
.im{height:150px;border-radius:24px;position:relative;width:100%}
.im .fav{position:absolute;inset-block-start:8px;inset-inline-end:8px;width:40px;height:40px;background:var(--card)}
.dis{position:absolute;inset-block-start:10px;inset-inline-start:10px;background:var(--red);color:var(--onred);border-radius:99px;font-size:12px;font-weight:600;padding:2px 10px}
.g1{background:linear-gradient(160deg,var(--lime),var(--lime-d))}
.g2{background:linear-gradient(160deg,var(--black),var(--n800))}
.g3{background:linear-gradient(160deg,var(--lime-l),var(--lime))}
.g4{background:linear-gradient(160deg,var(--n600),var(--black))}
.c .g1,.c .g3{color:var(--dk)}
.c .g2,.c .g4{color:var(--white)}
.pc{width:100%;display:flex;flex-direction:column;gap:6px}
.pc h3{margin:6px 0 0;font-size:15px;font-weight:600}
.rt{display:flex;gap:4px;align-items:center;color:var(--mute);font-size:12.5px}
.rt .i{width:14px;height:14px;fill:var(--am);stroke:none}
.circ{border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:var(--white);font-size:15px}
.blob{border-radius:48% 52% 42% 58%/55% 45% 55% 45%}
.sm2{width:52px;height:52px}
.item small,.who small{display:block;color:var(--mute);font-size:12px}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--lime),var(--lime-d));display:grid;place-items:center;color:var(--black);font-weight:600;font-size:14px;flex:none;position:relative}
.av.c2{background:linear-gradient(135deg,var(--n700),var(--black));color:var(--white)}
.av.c3{background:linear-gradient(135deg,var(--lime-l),var(--lime))}
.av.b{width:84px;height:84px;font-size:32px;box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--pink)}
.stack{display:flex}
.stack .av{box-shadow:0 0 0 3px var(--card);margin-inline-end:-10px}
.who{display:flex;gap:12px;align-items:center;font-size:14px;width:100%}
.who .rt{margin-inline-start:auto}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:99px;font-size:12px;font-weight:600;padding:3px 12px;background:var(--red);color:var(--onred)}
.tag:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:pu 1.6s infinite}
@keyframes pu{50%{opacity:.25}}
.tag.s{background:var(--pink);color:var(--dk)}
.tag.s:before{display:none}
/* order */
.item{display:flex;gap:12px;align-items:center;width:100%;font-size:14.5px}
.item>span:nth-child(2){flex:1}
.qty{display:inline-flex;align-items:center;gap:2px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--line);margin-top:6px}
.qty button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.qty button:hover{background:var(--bg)}
.qty .i{width:16px;height:16px}
.qty output{min-width:22px;text-align:center;font-weight:600}
.kv{width:100%;font-size:14.5px;margin:0}
.kv div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.kv div:last-child{border:0;font-size:16px;font-weight:700}
.kv dt{color:var(--mute);font-weight:400}
.kv dd{margin:0}
.t2{stroke:var(--lg)}
.bar{width:100%;height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--lg)}
.lg{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--mute)}
.lg span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-inline-end:6px}
.peak{display:flex;gap:4px;align-items:flex-end;height:80px;width:100%}
.peak i{flex:1;border-radius:6px 6px 2px 2px;background:var(--line);display:block}
.peak i.m{background:var(--lg)}
/* app */
.nav{display:flex;justify-content:space-around;width:100%;color:var(--mute);font-size:11.5px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;min-height:48px}
.nav .pill{width:48px;height:28px;border-radius:99px;display:grid;place-items:center}
.nav [aria-current] .pill{background:var(--lime);color:var(--dk)}
.nav [aria-current]{color:var(--ink);font-weight:500}
.head{display:flex;flex-direction:column;gap:12px;width:100%}
.head>div{display:flex;justify-content:space-between;align-items:center}
.head h3{margin:0;font-size:24px;font-weight:700}
.feed{width:100%;font-size:14px;display:flex;flex-direction:column;gap:16px;padding:0;margin:0;list-style:none}
.feed li{display:flex;gap:12px;position:relative}
.feed li:not(:last-child):before{content:"";position:absolute;inset-inline-start:17px;top:38px;bottom:-14px;width:2px;background:var(--line)}
.feed .ic{width:36px;height:36px;background:var(--mint);box-shadow:none}
.feed .ic .i{width:16px;height:16px}
.toast{box-shadow:0 8px 24px rgba(0,0,0,.3),0 0 0 1px var(--n700);position:fixed;inset-inline:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:calc(100% - 32px);background:var(--dk);color:var(--white);border-radius:99px;padding:10px 20px;font-size:14px;opacity:0;transform:translateY(12px);pointer-events:none;transition:.25s;z-index:40;display:flex;gap:8px;align-items:center}
.toast.on{opacity:1;transform:none}
.toast .i{color:var(--lime)}
.theme{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:var(--sh),inset 0 0 0 1px var(--line);z-index:4}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.c{align-items:stretch}
.c>small{align-self:flex-start}
.c.f{grid-column:1/-1}
@media(max-width:600px){.c.f{grid-column:span 1}}
.c .row{justify-content:flex-start}
.sf{padding:12px 16px;border-radius:16px;font-size:13px}
.s0{background:var(--bg)}
.s1{box-shadow:inset 0 0 0 1px var(--line)}
.s2{background:var(--mint)}
.bx{flex:1;height:30px;border-radius:8px;background:var(--pink);display:grid;place-items:center;font-size:11px;color:var(--dk)}
.spc{flex:2;border:1.5px dashed var(--mute);border-radius:8px;height:30px}
.rw{display:flex;gap:8px}
.cl{display:flex;flex-direction:column;gap:6px}
hr{border:0;height:1px;background:var(--line);width:100%;margin:0}
.ar{aspect-ratio:16/9;border-radius:16px;display:grid;place-items:center;font-size:12px;color:var(--white)}
.scr{height:72px;overflow:auto;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);padding:8px 12px;font-size:13px}
.btn.gh{background:transparent;box-shadow:none}
.btn.gh:hover{background:var(--bg)}
.btn.dg{background:var(--red);color:var(--onred)}
.btn.lg2{min-height:56px;padding:0 36px;font-size:16px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-top-color:transparent;animation:rot .8s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.fab{width:56px;height:56px;border-radius:50%;background:var(--lime);color:var(--dk);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.lk{color:var(--ink);font-weight:600;display:inline-flex;gap:4px;align-items:center;text-decoration:underline;text-underline-offset:4px}
.prs{padding:14px 16px;border-radius:20px;box-shadow:inset 0 0 0 1px var(--line);transition:transform .1s,background .15s;text-align:start;width:100%}
.prs:active{transform:scale(.98);background:var(--bg)}
.grp{display:inline-flex;box-shadow:inset 0 0 0 1px var(--line);border-radius:99px;overflow:hidden}
.grp button{min-height:44px;padding:0 16px;font-size:14px;display:grid;place-items:center}
.grp button:focus-visible{outline-offset:-3px}
.grp button+button{border-inline-start:1px solid var(--line)}
.grp [aria-pressed=true]{background:var(--pink);color:var(--dk)}
.ty{display:grid;gap:10px}
.ty>div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.ty small{color:var(--mute);font-size:11.5px;flex:none}
.ff{display:grid;gap:6px}
.ff label{font-size:13px;font-weight:600}
.ff small{font-size:12px;color:var(--mute)}
.ff.er .field{box-shadow:inset 0 0 0 2px var(--red)}
.ff.er small{color:var(--red);display:flex;gap:4px;align-items:center}
.tx{width:100%;border:0;color:var(--ink);box-shadow:inset 0 0 0 1px var(--bdc);border-radius:20px;padding:12px 16px;background:transparent;resize:none;font-size:15px}
.tx:focus{outline:0;box-shadow:inset 0 0 0 2px var(--ring)}
.field select{all:unset;flex:1;font-size:15px;color:var(--ink)}
.field select option{color:var(--ink);background:var(--card)}
.cbx{display:flex;gap:10px;align-items:center;min-height:40px;font-size:14.5px;cursor:pointer}
.cbx input{appearance:none;width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 1.5px var(--mute);display:grid;place-items:center;margin:0;flex:none;cursor:pointer}
.cbx input[type=radio]{border-radius:50%}
.cbx input:checked{background:var(--lime);box-shadow:none}
.cbx input:checked:after{content:"";width:6px;height:11px;border:solid var(--black);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.cbx input[type=radio]:checked:after{width:8px;height:8px;border-radius:50%;background:var(--black);border:0;transform:none}
.cbx .sw2{margin-inline-start:auto}
.sw2{appearance:none;width:48px;height:28px;border-radius:99px;background:var(--n500);position:relative;margin:0;cursor:pointer;transition:background .2s;flex:none}
.sw2:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--white);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:inset-inline-start .2s}
.sw2:checked{background:var(--teal)}
.sw2:checked:after{inset-inline-start:23px}
.otp{display:flex;gap:8px;direction:ltr}
.otp input{flex:1;min-width:0;height:56px;border-radius:16px;border:0;box-shadow:inset 0 0 0 1px var(--bdc);background:transparent;text-align:center;font-size:22px;font-weight:600}
.otp input:focus{box-shadow:inset 0 0 0 2px var(--ring);outline:0}
.dpk{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:13px}
.dpk em{font-style:normal;color:var(--mute);font-size:12px}
.dpk button{aspect-ratio:1;border-radius:50%}
.dpk button:hover{background:var(--bg)}
.dpk [aria-pressed=true]{background:var(--lime);color:var(--dk);font-weight:600}
.dpk .td{box-shadow:inset 0 0 0 1.5px var(--lg)}
.al{display:flex;gap:10px;padding:12px 14px;border-radius:18px;background:color-mix(in srgb,var(--c) 12%,var(--card));font-size:13.5px;line-height:1.5}
.al .i{color:var(--c);margin-top:2px}
.al b{display:block;font-size:14px}
.bn{display:flex;gap:10px;align-items:center;background:var(--lime);color:var(--dk);border-radius:18px;padding:10px 14px;font-size:14px;font-weight:500}
.bn span{flex:1}
.bn .btn{background:var(--dk);color:var(--white)}
.dlg{border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,.18),inset 0 0 0 1px var(--line);padding:20px;display:grid;gap:12px;text-align:center}
.dlg h4{margin:0;font-size:17px}
.dlg p{margin:0;color:var(--mute);font-size:14px}
.dlg .row{flex-wrap:nowrap}
.dlg .btn{flex:1;padding:0 12px}
.sheet{border-radius:28px 28px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.14),inset 0 0 0 1px var(--line);padding:10px 20px 20px;display:grid;gap:10px}
.sheet:before{content:"";width:40px;height:4px;border-radius:9px;background:var(--line);margin:auto}
.sk{background:linear-gradient(90deg,var(--line) 25%,var(--bg) 50%,var(--line) 75%);background-size:200% 100%;animation:sh 1.4s infinite;border-radius:10px;display:block}
@keyframes sh{to{background-position:-200% 0}}
.stt{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;text-align:center;font-size:13.5px;font-weight:600}
.stt>div{display:grid;gap:6px;justify-items:center}
.stt p{margin:0;color:var(--mute);font-size:12px;font-weight:400}
.stt .ic{width:52px;height:52px;box-shadow:none;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.bar2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bar2 b{font-size:17px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;min-height:44px;color:var(--mute);font-size:14px;position:relative}
.tabs [aria-selected=true]{color:var(--ink);font-weight:600}

const n=b.closest('[data-n]');if(n)[...n.querySelectorAll('button')].forEach(x=>x===b?x.setAttribute('aria-current','page'):x.removeAttribute('aria-current'));
